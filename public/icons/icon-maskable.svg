<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- Maskable icons devem preencher TODO o canvas (sem rounded corners),
       o sistema operacional aplica a forma do app. Safe zone: centro 80%. -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Mark centralizado na safe zone (256x256 no centro) -->
  <g transform="translate(256 256) scale(0.7)" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-120 20 a 120 120 0 0 1 240 0 v 60 a 30 30 0 0 1 -30 30 h -30 v -90 h 60" />
    <path d="M-120 20 v 60 a 30 30 0 0 0 30 30 h 30 v -90 h -60" />
  </g>
</svg>
