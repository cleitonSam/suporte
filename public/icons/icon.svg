<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Headphones-like mark (matching the Lucide HeadphonesIcon used elsewhere) -->
  <g transform="translate(256 256)" stroke="url(#ringGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-120 20 a 120 120 0 0 1 240 0 v 60 a 30 30 0 0 1 -30 30 h -30 v -90 h 60" />
    <path d="M-120 20 v 60 a 30 30 0 0 0 30 30 h 30 v -90 h -60" />
  </g>

  <!-- Tiny status dot -->
  <circle cx="384" cy="384" r="32" fill="#FFFFFF" />
  <circle cx="384" cy="384" r="18" fill="#10B981" />
</svg>
